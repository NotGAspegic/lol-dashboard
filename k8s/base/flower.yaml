apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: farsight
  labels:
    app.kubernetes.io/name: flower
    app.kubernetes.io/part-of: farsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flower
        app.kubernetes.io/part-of: farsight
    spec:
      enableServiceLinks: false
      containers:
        - name: flower
          image: lol_backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - worker.celery_app
            - flower
            - --port=5555
            - --basic_auth=$(FLOWER_USER):$(FLOWER_PASSWORD)
          ports:
            - containerPort: 5555
              name: http
          envFrom:
            - configMapRef:
                name: farsight-config
            - secretRef:
                name: farsight-secrets
          resources:
            requests:
              cpu: 75m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: farsight
  labels:
    app.kubernetes.io/name: flower
spec:
  selector:
    app.kubernetes.io/name: flower
  ports:
    - name: http
      port: 5555
      targetPort: http
